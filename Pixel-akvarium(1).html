<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// Minimal orbit controls (rotate / pan / zoom, mouse + touch) so no addon import is needed.
class OrbitControls {
  constructor(camera, dom) {
    this.camera = camera; this.dom = dom; this.target = new THREE.Vector3();
    this.enableDamping = true; this.dampingFactor = 0.08; this.minDistance = 1; this.maxDistance = 500;
    this.minPolarAngle = 0.05; this.maxPolarAngle = Math.PI - 0.05; this.screenSpacePanning = true;
    this.autoRotate = false; this.autoRotateSpeed = 1; this.enabled = true;
    this.sph = new THREE.Spherical(); this.dTheta = 0; this.dPhi = 0; this.scale = 1; this.panOff = new THREE.Vector3();
    this.ptrs = new Map(); this.mode = null; this.pinch = 0;
    dom.style.touchAction = 'none';
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('pointerdown', e => {
      if (!this.enabled) return;
      dom.setPointerCapture(e.pointerId);
      this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.ptrs.size === 1) this.mode = (e.button === 2 || e.button === 1 || e.ctrlKey || e.shiftKey) ? 'pan' : 'rotate';
      else if (this.ptrs.size === 2) { this.mode = 'touch2'; this.pinch = this.pinchDist(); }
    });
    dom.addEventListener('pointermove', e => {
      const p = this.ptrs.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (this.mode === 'rotate') { this.dTheta -= 2 * Math.PI * dx / dom.clientHeight; this.dPhi -= 2 * Math.PI * dy / dom.clientHeight; }
      else if (this.mode === 'pan') this.pan(dx, dy);
      else if (this.mode === 'touch2') {
        const [a, b] = [...this.ptrs.values()];
        // average movement of both fingers pans; distance change zooms
        this.pan(dx / 2, dy / 2);
        p.x = e.clientX; p.y = e.clientY;
        const d = this.pinchDist(); if (this.pinch > 0 && d > 0) this.scale *= this.pinch / d; this.pinch = d;
        return;
      }
      p.x = e.clientX; p.y = e.clientY;
    });
    const up = e => { this.ptrs.delete(e.pointerId); if (this.ptrs.size === 0) this.mode = null; else if (this.ptrs.size === 1) this.mode = 'rotate'; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e => { e.preventDefault(); this.scale *= Math.pow(0.95, -e.deltaY / 53); }, { passive: false });
  }
  pinchDist() { const v = [...this.ptrs.values()]; return v.length < 2 ? 0 : Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y); }
  pan(dx, dy) {
    const cam = this.camera, dist = cam.position.distanceTo(this.target);
    const h = 2 * dist * Math.tan(cam.fov / 2 * Math.PI / 180) / this.dom.clientHeight;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrix, 0);
    const upv = this.screenSpacePanning ? new THREE.Vector3().setFromMatrixColumn(cam.matrix, 1) : new THREE.Vector3(0, 1, 0);
    this.panOff.addScaledVector(right, -dx * h).addScaledVector(upv, dy * h);
  }
  update() {
    if (!this.enabled) { this.dTheta = this.dPhi = 0; this.scale = 1; this.panOff.set(0, 0, 0); return; }
    const off = new THREE.Vector3().subVectors(this.camera.position, this.target);
    this.sph.setFromVector3(off);
    if (this.autoRotate && !this.mode) this.dTheta -= 2 * Math.PI / 60 / 60 * this.autoRotateSpeed;
    const k = this.enableDamping ? this.dampingFactor : 1;
    this.sph.theta += this.dTheta * k; this.sph.phi += this.dPhi * k;
    this.sph.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, this.sph.phi));
    this.sph.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.sph.radius * (1 + (this.scale - 1) * k)));
    this.target.addScaledVector(this.panOff, k);
    this.camera.position.setFromSpherical(this.sph).add(this.target);
    this.camera.lookAt(this.target);
    if (this.enableDamping) { this.dTheta *= 1 - k; this.dPhi *= 1 - k; this.scale = 1 + (this.scale - 1) * (1 - k); this.panOff.multiplyScalar(1 - k); }
    else { this.dTheta = this.dPhi = 0; this.scale = 1; this.panOff.set(0, 0, 0); }
  }
}

renderer.setPixelRatio(pixelSize === 1 ? Math.min(2, devicePixelRatio) : 1 / pixelSize);
renderer.setSize(innerWidth, innerHeight);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);

controls.target.set(0, 7.5, 0);

sun.position.set(30, 26, -2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -42, right: 42, top: 42, bottom: -42, near: 1, far: 120 });
sun.shadow.bias = -0.0008;
scene.add(sun);

// ================= Voxel helpers =================
const BOX = new THREE.BoxGeometry(1, 1, 1);
const MAT = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0 });
const glowMats = [];
const D = new THREE.Object3D(), C = new THREE.Color();
let night = false, glowLevel = 0;

function instanced(list, size, mat, useColor = true) {
  const m = new THREE.InstancedMesh(BOX, mat, list.length);
  list.forEach((v, i) => {
    D.position.set(v.x * size, v.y * size, v.z * size); D.rotation.set(0, 0, 0); D.scale.setScalar(size); D.updateMatrix();

// voxels: [{x,y,z,c,glow?}] in voxel units. glow = emissive colour used at night.
function voxelGroup(voxels, size) {
  const g = new THREE.Group(), normal = [], glow = new Map();
  for (const v of voxels) {
    if (v.glow) { const k = v.c + '|' + v.glow; if (!glow.has(k)) glow.set(k, []); glow.get(k).push(v); }

  if (normal.length) g.add(instanced(normal, size, MAT));
  for (const [k, list] of glow) {
    const [c, e] = k.split('|');
    const m = new THREE.MeshStandardMaterial({ color: c, emissive: e, emissiveIntensity: glowLevel, roughness: 0.8 });
    glowMats.push(m);
    g.add(instanced(list, size, m, false));

}
// Fill a grid with fn(x,y,z) -> colour | {c,glow} | null and keep only surface voxels.
function voxelize(nx, ny, nz, fn, ox = 0, oy = 0, oz = 0) {
  const grid = new Array(nx * ny * nz), id = (x, y, z) => x + nx * (y + ny * z);
  for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const r = fn(x, y, z); if (r) grid[id(x, y, z)] = typeof r === 'string' ? { c: r } : r;
  }
  const empty = (x, y, z) => x < 0 || y < 0 || z < 0 || x >= nx || y >= ny || z >= nz || !grid[id(x, y, z)];
  const out = [];
  for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const g = grid[id(x, y, z)]; if (!g) continue;
    if (empty(x - 1, y, z) || empty(x + 1, y, z) || empty(x, y - 1, z) || empty(x, y + 1, z) || empty(x, y, z - 1) || empty(x, y, z + 1))

  }
  return out;
}
function pixelTexture(rows, pal) {
  const cv = document.createElement('canvas'); cv.width = rows[0].length; cv.height = rows.length;
  const g = cv.getContext('2d');

  return t;
}

// ================= Tank =================
{
  const glass = new THREE.Mesh(new THREE.BoxGeometry(XM * 2 + 0.3, SURF + 1.8, ZM * 2 + 0.3),
    new THREE.MeshBasicMaterial({ color: '#cdefff', transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide }));
  glass.position.y = (SURF + 1.8) / 2 - 0.5; scene.add(glass);

}

// ================= The attic =================
// A small, warm voxel attic. Modelled with the ridge along local x and turned 90°, so: local -x = front (camera side),

{

rotBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; rotBtn.textContent = controls.autoRotate ? 'Stopp rotasjon' : 'Auto-rotér'; };

// ================= Loop =================
const clock = new THREE.Clock();
function simStep(dt, t) {
  scare.t -= dt;
  updPair(dt);
  for (const f of fish) updFish(f, dt);
  updGoby(dt); updCrab(dt, t); updChest(dt); updSnail(dt, t); updShrimp(dt, t);
  updDiver(dt); updClam(dt); updBoats(dt, t); updSub(dt, t); updDuckweed(dt, t);
  updBubbles(dt, t); updFood(dt, t); updParts(dt); updRipples(dt);
}
window.__aq = { scene, bubbleMesh, airStone, sub, boats, enterSub, snail, attic, pair, goby, fish, foods, crab, chest, simStep, dropFood, camera, controls, knock, snail, shrimps, select, pickFish,
  get daylight() { return daylight; }, setDay(k) { dayTarget = k; }, forceDay(k) { daylight = dayTarget = k; applyDaylight(k); }, get scare() { return scare; } };
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  updDaylight(dt);
  simStep(dt, t);
  updWeeds(t); updSurface(t); updShafts(t); updFlag(t); updCaustics(t, dt); updSelection(dt); updRoom(t, dt);
  controls.update(); if (!sub.piloted) clampCamera();
  if (camShake > 0 && !sub.piloted) { camShake -= dt; const a = camShake * 0.12; camera.position.x += Math.sin(t * 90) * a; camera.position.y += Math.cos(t * 70) * a; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
