<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravnedal – en middelalderdal</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#f1e4c2;font-family:'Press Start 2P',monospace;}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
  .bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:96vw;}
  button{font-family:inherit;font-size:9px;color:#2a1a0e;background:#e6d3a3;border:0;padding:8px 8px;
    box-shadow:inset -3px -3px 0 #a9895a,inset 3px 3px 0 #fff3d2;cursor:pointer;}
  button:active{box-shadow:inset 3px 3px 0 #a9895a;}
  button.on{background:#f2c35b;box-shadow:inset -3px -3px 0 #b07f26,inset 3px 3px 0 #ffe9a8;}
  .hint{position:fixed;left:12px;top:12px;font-size:8px;line-height:2;opacity:.75;pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;}
  #clock{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:10px;color:#ffe9a8;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;white-space:nowrap;}
  #log{position:fixed;right:12px;top:12px;width:min(330px,42vw);background:#140f0bd9;border:2px solid #b08a4a;box-shadow:0 0 0 2px #2a1d10;padding:8px 10px 6px;}
  #log .lh{font-size:9px;color:#f2c35b;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  #log .lh span{cursor:pointer;opacity:.7}
  #logl{font-family:'VT323',monospace;font-size:18px;line-height:1.05;max-height:38vh;overflow:hidden;}
  #logl div{padding:3px 0 4px;border-top:1px solid #3a2a18;cursor:default;}
  #logl div.go{cursor:pointer}
  #logl div.go:hover{color:#fff}
  #logl i{font-style:normal;color:#c9a46a;font-size:15px;display:block}
  #logl div.new{animation:flash 1.6s ease-out}
  @keyframes flash{from{background:#f2c35b44}to{background:transparent}}
  body.logmin #logl{display:none}
  #label{position:fixed;display:none;transform:translate(-50%,-100%);background:#140f0bee;border:2px solid #f2c35b;padding:8px 10px;max-width:260px;color:#f8eed6;pointer-events:auto;}
  #label b{font-size:9px;color:#f2c35b;display:block;margin-bottom:4px;line-height:1.6}
  #label .d{font-family:'VT323',monospace;font-size:17px;line-height:1.05;}
  #label .a{font-family:'VT323',monospace;font-size:16px;color:#bfe3a0;margin-top:3px}
  #label .row{margin-top:6px;display:flex;gap:5px}
  #label button{padding:5px 7px;font-size:8px}
  #err{display:none;position:fixed;inset:0;padding:24px;font-size:11px;line-height:1.8;background:#0b0d14;color:#ffb3b3;white-space:pre-wrap;z-index:9}

  #showui{display:none;position:fixed;right:10px;bottom:10px;padding:6px 8px;font-size:8px;opacity:.25;z-index:6}
  #showui:hover{opacity:1}
  body.clean #showui{display:block}
  #mini{position:fixed;left:12px;bottom:14px;width:192px;height:128px;border:2px solid #b08a4a;box-shadow:0 0 0 2px #2a1d10;cursor:pointer;image-rendering:pixelated;}

  #area span{font-family:'VT323',monospace;font-size:20px}
  body.clean #area{display:none}
  #title{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 2.5s;text-shadow:0 3px 0 #000,0 0 18px #000}
  #title h1{font-size:clamp(18px,4vw,38px);margin:0 0 14px;color:#f2c35b;font-weight:400}
  #title p{font-family:'VT323',monospace;font-size:22px;margin:0}
  @media (max-width:700px){ .hint{display:none} #log{width:52vw} #logl{font-size:15px;max-height:24vh} }

<div class="hint">Kameraet flyr en rute gjennom landet · Dra i bildet for å styre selv<br>Klikk på noe for å se hva det er · H: skjul menyen</div>
<div id="clock"></div>

<div class="bar">
  <button id="bfly" class="on">Flytur</button>

  <button id="bfollow">Følg: –</button>
  <button id="bdir" class="on">Regi: nær</button>
  <button id="bevent">Noe skjer!</button>
  <button id="btime">Tid: 1×</button>
  <button id="bjump">Til natt</button>
  <button id="bseason">Årstid</button>
  <button id="bweather">Vær: klart</button>
  <button id="bsnd">Lyd: av</button>
  <button id="bpix">Piksler: 3</button>
</div>
<button id="showui">Vis meny</button>
<div id="err"></div>
<script>
  window.showErr = (m) => { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent += m + '\n'; };
  window.addEventListener('error', e => showErr('Feil: ' + (e.message || e.type) + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')));
  window.addEventListener('unhandledrejection', e => showErr('Feil: ' + (e.reason && e.reason.message || e.reason)));
  setTimeout(() => { if (!window.__dal) showErr('Dalen startet ikke innen 20 sekunder. Sjekk at nettleseren når cdn.jsdelivr.net og støtter WebGL.'); }, 20000);
</script>
<script type="module">

// ---------- Basics ----------

const store = { k: 'ravnedal.v2', data: {} };
try { store.data = JSON.parse(localStorage.getItem(store.k) || '{}') || {}; } catch (e) { store.data = {}; }
function save() { try { localStorage.setItem(store.k, JSON.stringify(store.data)); } catch (e) {} }

let renderer;

const applyPR = () => renderer.setPixelRatio(pixelSize === 1 ? Math.min(2, devicePixelRatio) : 1 / pixelSize);

document.body.prepend(renderer.domElement);

scene.fog = new THREE.FogExp2('#9cc8e8', 0.006);
const FAR = 330;
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.3, FAR + 40);
camera.position.set(-180, 24, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-125, 6, 6);
controls.minDistance = 5; controls.maxDistance = 120; controls.maxPolarAngle = 1.5;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight('#cfe4ff', '#6a5a3a', 1); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d0', 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 460 });
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.06;
scene.add(sun, sun.target);

// ---------- Voxel helpers ----------

const specCache = new Map();
